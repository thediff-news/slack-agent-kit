store:
  driver: sqlite          # "pi-durable" to run state on @earendil-works/pi-durable instead
  path: data/kit.sqlite
auditLogPath: data/audit.jsonl
rag:
  dbPath: data/rag.sqlite
  dimensions: 512
connectors:
  docs:
    type: filesystem
    root: examples/fixtures/demo-docs
  triage-target:
    type: filesystem
    root: examples/fixtures/target-repo
  incident-target:
    type: filesystem
    root: examples/fixtures/incident-repo
permissions:
  roles:
    admin: [read, propose, execute, approve]
    operator: [read, propose, approve]
    viewer: [read]
  users:
    cli-operator: admin
    cli-viewer: viewer
  approvers: [cli-operator]
  channels:
    cli:
      allow: ["*"]
  roleAcls:
    admin: [finance, engineering]
    operator: [engineering]
    viewer: []
approval:
  timeoutMinutes: 60
skills:
  alert-router:
    escalateThreshold: 3
    routing:
      checkout: "@payments-oncall"
      payments: "@payments-oncall"
      auth: "@identity-oncall"
